<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Shop Hoa</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .header{
            height:120px;
            background:#fff;
        }

        .left-menu{
            background:#dc3545;
            min-height:500px;
        }

        .right-ads{
            background:#ffc107;
            min-height:500px;
        }

        .footer{
            background:#6c757d;
            color:white;
            padding:10px;
        }

        .product-card img{
            height:180px;
            object-fit:cover;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header text-center">
        <img src="logo.png" class="img-fluid" alt="">
    </div>

    <!-- Menu -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <ul class="navbar-nav w-100 justify-content-around">
                <li class="nav-item"><a class="nav-link" href="#">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Sản phẩm</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Tin tức</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Giới thiệu</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Liên hệ</a></li>
            </ul>
        </div>
    </nav>

    <div class="row">

        <!-- Left -->
        <div class="col-md-2 left-menu text-white p-3">
            <p>Trang chủ</p>
            <p>Sản phẩm</p>
            <p>Tin tức</p>
            <p>Giới thiệu</p>
            <p>Liên hệ</p>
        </div>

        <!-- Content -->
        <div class="col-md-8">
            <div class="row mt-2" id="product-list">

            </div>
        </div>

        <!-- Right -->
        <div class="col-md-2 right-ads">
            Quảng cáo
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        Footer
    </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function(){

    let html = "";

    for(let i=1;i<=6;i++){
        html += `
        <div class="col-md-4 mb-3">
            <div class="card product-card">
                <img src="images/hoahong.webp" class="card-img-top">

                <div class="card-body">
                    <h5>Hoa Hồng</h5>
                    <p>Hoa Hồng đỏ trồng trên đất cao nguyên Đà Lạt</p>

                    <div class="border p-2 mb-2">
                        Giá 50000đ
                    </div>

                    <button class="btn btn-primary btn-sm btn-mua">
                        Đặt mua
                    </button>
                </div>
            </div>
        </div>`;
    }

    $("#product-list").html(html);

    $(".btn-mua").click(function(){
        alert("Đặt mua thành công!");
    });

});
</script>

</body>
</html>
